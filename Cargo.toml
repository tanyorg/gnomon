[package]
# Published as gnomon-gnss (the "gnomon" crate name is taken); the
# installed commands are `gnomon` and `metronomon`.
name = "gnomon-gnss"
version = "0.2.2"
edition = "2021"
description = "Monitors for NTP servers on GNSS receivers: gnomon shows NMEA output timing, regularity and dropouts (gpsd, raw TCP, serial); metronomon shows per-pulse PPS offset and jitter via the Linux PPS API"
authors = ["tany <tany@tany.org>"]
license = "BSD-2-Clause"
rust-version = "1.80"
repository = "https://github.com/tanyorg/gnomon"
readme = "README.md"
keywords = ["gnss", "gps", "nmea", "ntp", "pps"]
categories = ["command-line-utilities", "hardware-support"]
exclude = ["/tools", "/.gitignore", "/*.png"]

# Intentionally dependency-free (std only).

[[bin]]
name = "gnomon"
path = "src/main.rs"

[[bin]]
name = "metronomon"
path = "src/bin/metronomon.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
