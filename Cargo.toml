[package]
# Published as gnomon-gnss (the "gnomon" crate name is taken); the
# installed command is still `gnomon`.
name = "gnomon-gnss"
version = "0.1.0"
edition = "2021"
description = "GNSS/NMEA 0183 monitor modelled on gpsd's gpsmon: gpsd, raw NMEA over TCP, or serial port"
authors = ["tany <tany@tany.org>"]
license = "BSD-2-Clause"
rust-version = "1.80"
repository = "https://github.com/tanyorg/gnomon"
readme = "README.md"
keywords = ["gnss", "gps", "nmea", "ntp", "gpsd"]
categories = ["command-line-utilities", "hardware-support"]
exclude = ["/tools", "/.gitignore"]

# Intentionally dependency-free (std only).

[[bin]]
name = "gnomon"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
