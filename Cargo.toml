[package]
name = "gnomon"
version = "0.1.0"
edition = "2021"
description = "GNSS/NMEA 0183 monitor modelled on gpsd's gpsmon: gpsd, raw NMEA over TCP, or serial port"
authors = ["tany <tany@tany.org>"]
license = "BSD-2-Clause"
rust-version = "1.80"

# Intentionally dependency-free (std only).

[[bin]]
name = "gnomon"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
